services:
  ai-service:
    build: .
    container_name: ai-service
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/1
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # R-03: question-vetting runs canonical solutions in the hardened runner-python HTTP runner.
      RUNNER_HTTP_URL: http://host.docker.internal:8001  # runner-python on the host
      RUNNER_STUB_TOKEN: ${RUNNER_STUB_TOKEN}
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CHROME_PATH: /usr/bin/chromium
      
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
    depends_on:
      - redis
    networks:
      - ai-net

  redis:
    image: redis:7
    container_name: ai-redis
    ports:
      - "6380:6379"
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge