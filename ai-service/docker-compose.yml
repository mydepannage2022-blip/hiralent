services:
  ai-service:
    build: .
    container_name: ai-service
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/1
      SANDBOX_SERVICE_URL: host.docker.internal:50054  # talk to sandbox on Windows host
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
    depends_on:
      - redis
    networks:
      - ai-net

  redis:
    image: redis:7
    container_name: ai-redis
    ports:
      - "6379:6379"
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge
