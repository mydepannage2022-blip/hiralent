[pytest]
markers =
    integration: marks tests that hit real external services (deselect with '-m "not integration"')

filterwarnings =
    ignore:.*BaseCommand.*is deprecated.*:DeprecationWarning
    ignore:Importing 'parser.split_arg_string' is deprecated.*:DeprecationWarning
    ignore:coroutine 'InterceptedUnaryUnaryCall._invoke' was never awaited:RuntimeWarning
    ignore:.*InterceptedCall.__del__.*:pytest.PytestUnraisableExceptionWarning
