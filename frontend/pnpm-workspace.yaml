# Single-project pnpm settings (pnpm v10.16+ moved these out of package.json).
# Native / postinstall dependencies allowed to run build scripts on install.
allowBuilds:
  core-js: true
  sharp: true

# Security remediation (Wave 1 / Session 7): patched sub-versions for advisories reaching us
# only transitively (next/@tensorflow/tfjs). Direct deps (next, axios) are bumped in package.json.
# Same-major patch bumps — verified by `next build`. See matrices/dependency-audit.md.
overrides:
  form-data: '>=4.0.6'
  postcss: '>=8.5.12'
  sharp: '>=0.35.0'
