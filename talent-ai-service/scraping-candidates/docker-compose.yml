version: "3.9"

services:
  api:
    build: .
    ports:
      - "8010:8010"
    env_file:
      - .env
    depends_on:
      - redis
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010"]

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    command: ["python", "-m", "app.workers.worker"]

  redis:
    image: redis:7
    ports:
      - "6379:6379"
