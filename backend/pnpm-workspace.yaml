# Single-project pnpm settings (pnpm v10.16+ moved these out of package.json).
# Native / postinstall dependencies allowed to run build scripts on install.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  canvas: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  tesseract.js: true

# Security remediation (Wave 1 / Session 7): force patched sub-versions for advisories that
# reach us only through transitive deps (direct deps are bumped in package.json). Each pin is a
# same-major patch/minor of an already-installed package — verified by `pnpm build` + the runtime
# gate (verify-authz-matrix / verify-default-deny-authz boot the backend and exercise prisma).
# `jws` (via firebase-admin) has NO patched release upstream → documented-accepted, deferred to
# Wave 8 (firebase-admin major upgrade). See matrices/dependency-audit.md.
overrides:
  form-data: '>=4.0.6'
  '@langchain/core': '>=1.1.8'
  langsmith: '>=0.6.0'
  protobufjs: '>=7.5.5'
  websocket-driver: '>=0.7.5'
  '@grpc/grpc-js': '>=1.14.4'
  '@xmldom/xmldom': '>=0.8.12'
  defu: '>=6.1.5'
  effect: '>=3.20.0'
  engine.io: '>=6.6.7'
  socket.io-parser: '>=4.2.6'
  fast-xml-parser: '>=5.3.4'
  lodash: '>=4.17.24'
  node-forge: '>=1.3.4'
  path-to-regexp: '>=8.4.0'
  postcss: '>=8.5.12'
  underscore: '>=1.13.8'
  undici: '>=7.24.0'
  ws: '>=8.21.0'
