version: '3.8'

services:
  document-validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-validator-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Optional: Mount logs directory
      - ./logs:/app/logs
    extra_hosts:
      # Enable access to host services (Windows/Mac Docker Desktop)
      - "host.docker.internal:host-gateway"
