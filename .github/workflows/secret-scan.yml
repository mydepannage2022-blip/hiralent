name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -eo pipefail
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --no-git scans the working tree rather than git history. History still contains
      # the Gemini key that was committed before Wave 1 Phase 1.1; that key has been
      # revoked and rotated, and the history rewrite is deliberately deferred (see
      # hiralent-master-plan/runbooks/secret-rotation.md). Scanning the tree is what
      # prevents NEW leaks from landing, which is the point of this gate.
      - name: Scan working tree for secrets
        run: |
          set -eo pipefail
          gitleaks detect \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
